name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # pull_request_target runs with a write token, so trust only what the
    # event payload proves: Dependabot authored the pull request and its head
    # branch lives in this repository. github.actor alone is the account that
    # caused this event, which a confused-deputy push can make Dependabot.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
      - name: Enable auto-merge for grouped patch or Actions digest updates
        if: |
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' && steps.metadata.outputs.dependency-group != '') ||
          (steps.metadata.outputs.package-ecosystem == 'github-actions' && steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
