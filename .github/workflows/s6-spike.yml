# SPIKE (temporary, never merged): native allocator benchmark on macOS and Windows.
# One job per OS builds every allocator variant, then runs the interleaved matrix.
name: s6 allocator spike
on:
  push:
    branches: [claude/s6-spike-macwin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s6-spike
  cancel-in-progress: true
jobs:
  spike:
    name: spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, variants: system minew mizone mizone-new }
          - { os: windows-2022, variants: system minew }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install ccache
        shell: bash
        run: |
          scripts/install-ci-tool.sh --tool ccache
          echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
          echo "LIBASSIMP_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - run: pnpm run check:capabilities && pnpm exec tsdown && node scripts/write-native-loaders.mjs
      - name: Build every variant
        shell: bash
        env:
          VARIANTS: ${{ matrix.variants }}
        run: |
          export CMAKE_JS_INC="$(pnpm exec cmake-js print-cmakejs-include | tail -n 1)"
          export CMAKE_JS_LIB="$(pnpm exec cmake-js print-cmakejs-lib | tail -n 1)"
          export CMAKE_JS_SRC="$(pnpm exec cmake-js print-cmakejs-src | tail -n 1)"
          for v in $VARIANTS; do
            echo "::group::build $v"
            start=$SECONDS
            # The export and host checks run last; report them without losing the addon.
            LIBASSIMP_SPIKE_ALLOC=$v LIBASSIMP_NATIVE_BUILD_DIR="build/native-$v" CMAKE_JS_OUTPUT_DIR="$GITHUB_WORKSPACE/native-output-$v" \
              pnpm run build:native || echo "::warning::build:native failed for $v (see log)"
            mkdir -p "addons/$v"
            find "native-output-$v" -name libassimp.node -exec cp {} "addons/$v/libassimp.node" \;
            ls -l "addons/$v"
            echo "build $v took $((SECONDS - start)) s"
            LIBASSIMP_NATIVE_ADDON="$GITHUB_WORKSPACE/addons/$v/libassimp.node" node src/cpp/node-addon.test.mjs > "addon-test-$v.log" 2>&1 \
              && echo "addon tests $v: pass" || { echo "::warning::addon tests failed for $v"; tail -40 "addon-test-$v.log"; }
            echo "::endgroup::"
          done
          ccache --show-stats || true
      - name: Generate models
        shell: bash
        run: |
          mkdir -p models
          node spike/gen-models.mjs models 64 256 1024
          cp bench/fixtures/helical-gear.glb models/gear.glb
          cp assimp/test/models/glTF2/DamagedHelmet.glb models/helmet.glb
          for f in grid64 grid256 grid1024 helmet; do
            NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/addons/system/libassimp.node" node spike/run.mjs "$PWD/dist" native "models/$f.glb" usdz "models/$f.usdz"
          done
          ls -l models
      - name: Interleaved matrix
        shell: bash
        run: node spike/drive.mjs 5 ${{ matrix.variants }}
      - name: Summary
        if: always()
        shell: bash
        run: |
          node spike/summary.mjs ${{ matrix.variants }} | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.os }}
          path: |
            results
            summary.txt
            addon-test-*.log
