name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files

  # The only place wasm is built. Every downstream job consumes these artifacts;
  # nothing else runs Emscripten. The image digest is the literal from
  # emsdk-image.txt, which `pnpm run workflows` asserts stays equal to it —
  # `container:` cannot be computed from a file.
  build-wasm:
    needs: preflight
    runs-on: ubuntu-24.04
    # Origin: about 3x the measured cold full-format job after the -O2 link:
    # compile takes roughly 25 minutes on 4 vCPU and link takes less than 1
    # minute. The prior 240-minute ceiling matched the -O3 link on run 32583934372.
    timeout-minutes: 90
    container:
      image: emscripten/emsdk:6.0.8@sha256:f174124ff798a3ead1abef247d9a849c270b642d552fea500a42565ff210f765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install the build tools the emsdk image omits
        run: apt-get update && apt-get install -y --no-install-recommends ccache ninja-build
      - name: Record the engine submodule commit
        id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The artifacts are a pure function of these inputs, and the determinism tests
      # prove the outputs are reproducible, so an exact hit skips a link that costs
      # over an hour; no restore-keys, because a near miss is a wrong answer, and
      # validate-pack still asserts the manifest's image and engine sha downstream.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: wasm-cache
        with:
          path: src/wasm/libassimp.*
          key: wasm-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules') }}-${{ steps.engine.outputs.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules') }}-${{ steps.engine.outputs.sha }}
      - name: Build libassimp.wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          LIBASSIMP_EMSDK: host
        run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: src/wasm/libassimp.*
          if-no-files-found: error

  quality:
    needs: [preflight, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      # The format matrix reads the engine's own fixture corpus.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - run: pnpm nx run libassimp:quality
      - run: node --test tests/ci/ci-release.test.mjs tests/ci/release-attestations.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: [preflight, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Origin: knip's `assimp/**` ignore needs the submodule present when
          # `treatConfigHintsAsErrors` checks whether the pattern is useful.
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      # The docs site imports the package, so its build needs the glue and wasm.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - run: pnpm nx run libassimp:docs-prose

  node:
    needs: [preflight, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - run: pnpm nx run libassimp:test
      - run: pnpm nx run libassimp:typecheck

  # Cheap engine-regression signal: the same binding, built and exercised by
  # ctest on the host toolchain, without waiting for an Emscripten build.
  native:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install the native build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ccache ninja-build zlib1g-dev
      - name: Record the engine submodule commit
        id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-native-${{ hashFiles('assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**') }}-${{ hashFiles('.gitmodules') }}-${{ steps.engine.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-native-
      - name: Build and test the binding natively
        run: |
          cmake --preset native-test
          cmake --build --preset native-test --parallel
          ctest --preset native-test --output-on-failure

  candidate:
    needs: [preflight, quality, docs-prose, node, native, build-wasm]
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.manifest.outputs.filename }}
      integrity: ${{ steps.manifest.outputs.integrity }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - run: pnpm run build
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - run: |
          mkdir candidate
          npm pack --ignore-scripts --pack-destination candidate
      - id: manifest
        run: node scripts/candidate-manifest.mjs candidate
      - name: Clean-room candidate consumer
        run: pnpm run test:package
        env:
          LIBASSIMP_CANDIDATE_DIR: candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate
          path: candidate/
          if-no-files-found: error

  consumer:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - run: pnpm run test:package
        env:
          LIBASSIMP_CANDIDATE_DIR: candidate

  browser:
    name: browser (${{ matrix.browser }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-14
          - browser: webkit
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Extract the exact candidate
        run: |
          mkdir -p candidate/extracted
          tar -xzf "candidate/${{ needs.candidate.outputs.filename }}" -C candidate/extracted
      - name: Convert through the candidate wasm in Vitest browser mode
        run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          LIBASSIMP_DIST_DIR: candidate/extracted/package/dist

  benchmark:
    if: github.event_name == 'pull_request'
    needs: candidate
    runs-on: ubuntu-24.04
    env:
      # Origin: seven local macOS arm64 runs on 2026-08-25 measured
      # 44.836-50.650 ms for the Tau CLI helical-gear workload. The 500 ms
      # ceiling retains the prior gate's roughly 10x shared-runner headroom;
      # the same-runner +10% comparison below remains the regression gate.
      MAX_MEDIAN_MS: '500'
      MAX_INIT_MS: '100'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - name: Build the pull request benchmark
        id: current
        continue-on-error: true # The final step reports a build failure after preserving the benchmark comment.
        run: pnpm run build
      - name: Build main on the same runner
        id: base
        continue-on-error: true # Preserve the report when the detached base cannot be prepared.
        shell: bash
        run: |
          base_directory="$(mktemp -d)"
          git worktree add --detach "$base_directory" 'origin/${{ github.base_ref }}'
          git -C "$base_directory" submodule update --init --recursive
          if [[ -f "$base_directory/bench/gated.mjs" ]]; then
            # Wasm is CI-built and never committed, so the base tree reuses this
            # run's binary and the timing column isolates the TypeScript facade.
            # Normalize the detached base's private artifact URL before bundling
            # so a filename-only change remains benchmarkable on the same runner.
            mkdir -p "$base_directory/src/wasm"
            cp src/wasm/libassimp.* "$base_directory/src/wasm/"
            BASE_DIRECTORY="$base_directory" node --input-type=module -e "
              import { readFileSync, writeFileSync } from 'node:fs';
              const path = process.env.BASE_DIRECTORY + '/src/index.ts';
              const source = readFileSync(path, 'utf8');
              writeFileSync(path, source.replaceAll(/\.\/wasm\/libassimp-[a-z]+(?=\.(?:js|wasm))/gu, './wasm/libassimp'));
            "
            cd "$base_directory"
            pnpm install --frozen-lockfile
            pnpm exec tsdown
            mkdir -p dist/wasm
            cp src/wasm/libassimp.js src/wasm/libassimp.wasm dist/wasm/
            # The pull request owns the benchmark workload. Run that exact
            # harness and fixture against both facades so changing the corpus
            # cannot bypass the same-runner comparison as a new identity.
            mkdir -p bench/fixtures
            cp "$GITHUB_WORKSPACE/bench/gated.mjs" bench/gated.mjs
            cp "$GITHUB_WORKSPACE/bench/fixtures/helical-gear.glb" bench/fixtures/helical-gear.glb
            echo "directory=$base_directory" >> "$GITHUB_OUTPUT"
          fi
      - id: compare
        continue-on-error: true # Origin: the following always-run comment must report the failed comparison before the gate closes.
        shell: bash
        run: |
          failed=0
          base=-
          current=/tmp/current-benchmark-1.json
          node bench/gated.mjs > /tmp/current-benchmark-1.json || failed=1
          base_directory='${{ steps.base.outputs.directory }}'
          if [[ -n "$base_directory" ]]; then
            (cd "$base_directory" && node bench/gated.mjs > /tmp/base-benchmark-1.json) || failed=1
            (cd "$base_directory" && node bench/gated.mjs > /tmp/base-benchmark-2.json) || failed=1
            node bench/gated.mjs > /tmp/current-benchmark-2.json || failed=1
            current=/tmp/current-benchmark-1.json,/tmp/current-benchmark-2.json
            base=/tmp/base-benchmark-1.json,/tmp/base-benchmark-2.json
          fi
          node scripts/compare-benchmark.mjs "$current" "$base" /tmp/benchmark.md || failed=1
          exit "$failed"
      - name: Upsert benchmark comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- libassimp-benchmark -->';
            const body = fs.readFileSync('/tmp/benchmark.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - if: steps.current.outcome == 'failure' || steps.base.outcome == 'failure' || steps.compare.outcome == 'failure'
        run: exit 1

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm audit --audit-level high

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, candidate, consumer, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Publish exact candidates with provenance
        shell: bash
        run: |
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.filename,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$integrity" ]]; then
                echo "ERROR: registry integrity differs for $name@$version" >&2
                exit 1
              fi
              continue
            fi
            npm publish "./candidate/$filename" --access public --provenance
          done < /tmp/packages

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, candidate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Verify registry bytes and provenance
        shell: bash
        run: |
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version integrity; do
            published="$(npm view "$name@$version" dist.integrity)"
            if [[ "$published" != "$integrity" ]]; then
              echo "ERROR: registry integrity differs for $name@$version" >&2
              exit 1
            fi
          done < /tmp/packages
          workspace="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          mapfile -t package_specs < <(node -e "for (const p of require('$workspace/candidate/manifest.json').packages) console.log(p.name+'@'+p.version)")
          npm install --force --ignore-scripts "${package_specs[@]}"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'
      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ needs.preflight.outputs.version }}'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        build-wasm,
        quality,
        docs-prose,
        node,
        native,
        candidate,
        consumer,
        browser,
        benchmark,
        security,
        publish,
        registry-verify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'build-wasm', 'quality', 'docs-prose', 'node', 'native', 'candidate', 'consumer', 'browser', 'security'];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify');
          }
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (!['success', 'skipped'].includes(needs.benchmark?.result)) failures.push('benchmark');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
