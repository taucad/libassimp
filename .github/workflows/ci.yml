name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.matrix }}
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      smoke-matrix: ${{ steps.smoke-matrix.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" --ref "$REF_NAME" --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files
      - id: build-matrix
        run: node scripts/native-matrix.mjs --kind build
      - id: smoke-matrix
        run: node scripts/native-matrix.mjs --kind smoke

  # The only place Wasm is built. Every downstream job consumes this artifact;
  # nothing else runs Emscripten. The pinned image digest is mirrored by
  # emsdk-image.txt, which the workflow checks validate.
  build-wasm:
    needs: preflight
    runs-on: ubuntu-24.04
    # Origin: about 3x the measured cold full-format job after the -O2 link:
    # compile takes roughly 25 minutes on 4 vCPU and link takes less than 1 minute.
    timeout-minutes: 90
    container:
      image: emscripten/emsdk:6.0.8@sha256:f174124ff798a3ead1abef247d9a849c270b642d552fea500a42565ff210f765
    env:
      CCACHE_COMPILERTYPE: clang
      CCACHE_MAXSIZE: 1G
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install the build tools the emsdk image omits
        run: apt-get update && apt-get install -y --no-install-recommends ccache ninja-build
      - name: Record the engine submodule commit
        id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The artifacts are a pure function of these inputs, and determinism tests
      # prove the outputs are reproducible. No restore key is allowed: a near miss
      # is a wrong binary, and validate-pack checks the image and engine SHA.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: wasm-cache
        with:
          path: src/wasm/libassimp.*
          key: wasm-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules', 'scripts/build-wasm.mjs') }}-${{ steps.engine.outputs.sha }}
      # Objects survive across engine bumps through the restore prefix. em++ is a
      # thin launcher, so the compiler check is the pinned emsdk image instead.
      - name: Point ccache at the workspace
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=string:$(cat emsdk-image.txt)"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ccache-v1-wasm-${{ steps.engine.outputs.sha }}-${{ hashFiles('emsdk-image.txt') }}
          restore-keys: |
            ccache-v1-wasm-${{ steps.engine.outputs.sha }}-
            ccache-v1-wasm-
      - name: Build libassimp.wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          LIBASSIMP_EMSDK: host
        run: |
          ccache --zero-stats
          node scripts/build-wasm.mjs
          ccache --show-stats
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: src/wasm/libassimp.*
          if-no-files-found: error

  quality:
    needs: [preflight, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      # The format matrix reads the engine's own fixture corpus.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - run: pnpm nx run libassimp:quality
      - run: >-
          node --test
          tests/ci/ci-release.test.mjs
          tests/ci/release-attestations.test.mjs
          tests/native-packaging.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  node:
    needs: [preflight, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - run: pnpm nx run libassimp:test
      - run: pnpm nx run libassimp:typecheck

  # OpenUSD validates what the exporters write: usd-core 25.8 still ships the
  # ARKit ComplianceChecker behind `usdchecker --arkit`; 26.11 runs every
  # UsdValidation validator. Errors and warnings both fail.
  usd-validation:
    name: USD strict validation (usd-core ${{ matrix.usd-core }})
    needs: [preflight, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        usd-core: ['25.8', '26.11']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - run: pnpm run build
      - name: Install usd-core ${{ matrix.usd-core }}
        env:
          USD_CORE: ${{ matrix.usd-core }}
        run: |
          python3 -m venv /tmp/usd
          /tmp/usd/bin/python -m pip install --quiet "usd-core==$USD_CORE"
      - name: Export and validate the USD matrix
        shell: bash
        run: |
          mapfile -t layers < <(node scripts/export-usd-matrix.mjs /tmp/usd-matrix)
          /tmp/usd/bin/python scripts/usd-strict-check.py "${layers[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usd-matrix-${{ matrix.usd-core }}
          path: /tmp/usd-matrix
          if-no-files-found: warn

  # Compiling native code does not need Wasm, so it starts with build-wasm.
  # The addon is a pure function of the hashed inputs: a hit skips the compile
  # and its tests, which already passed for these exact inputs. Releases always
  # compile from scratch.
  native-build:
    name: native build (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_NOHASHDIR: 'true'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - name: Key the addon on its inputs
        id: addon
        shell: bash
        env:
          INPUTS: ${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'assimp-builds.json', '.gitmodules', 'cmake/**', 'src/cpp/**', 'src/generated/**', 'scripts/build-native.mjs', 'scripts/build-manylinux.sh', 'scripts/check-cpp-exports.mjs', 'scripts/check-native-host.mjs', 'scripts/lib/**', 'scripts/assimp-capability-*.json', 'scripts/generate-assimp-capabilities.mjs') }}
          RECIPE: ${{ matrix.recipe }}
        run: |
          # The manylinux toolchain is the image digest in build-manylinux.sh;
          # host builds use the runner image.
          toolchain="$ImageOS-$ImageVersion"
          if [[ "$RECIPE" == manylinux ]]; then toolchain=manylinux; fi
          manifest="$(node -p "const p=require('./package.json');const h=require('node:crypto').createHash('sha256');h.update(JSON.stringify([p.version,p.binary,p.devDependencies['node-addon-api'],p.devDependencies['cmake-js'],process.versions.node.split('.')[0]]));h.digest('hex').slice(0,16)")"
          engine="$(git -C assimp rev-parse HEAD)"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "key=addon-v1-${{ matrix.suffix }}-$toolchain-$manifest-$INPUTS-$engine" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: addon-cache
        if: needs.preflight.outputs.npm-publish != 'true'
        with:
          path: native-artifacts
          key: ${{ steps.addon.outputs.key }}
      - if: steps.addon-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install ccache
        if: steps.addon-cache.outputs.cache-hit != 'true' && matrix.recipe == 'host'
        shell: bash
        run: |
          scripts/install-ci-tool.sh --tool ccache
          echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
          echo "LIBASSIMP_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.addon-cache.outputs.cache-hit != 'true' && matrix.recipe == 'host'
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.suffix }}-${{ steps.addon.outputs.engine }}
          restore-keys: ccache-v1-${{ matrix.suffix }}-
      # The native tests read the generated capability module and the NAPI-RS
      # loader; nothing in this job needs the Wasm pair.
      - if: steps.addon-cache.outputs.cache-hit != 'true'
        run: pnpm run check:capabilities && pnpm exec tsdown && node scripts/write-native-loaders.mjs
      - name: Resolve the cmake-js Node inputs
        if: steps.addon-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          {
            echo "CMAKE_JS_INC=$(pnpm exec cmake-js print-cmakejs-include | tail -n 1)"
            echo "CMAKE_JS_LIB=$(pnpm exec cmake-js print-cmakejs-lib | tail -n 1)"
            echo "CMAKE_JS_SRC=$(pnpm exec cmake-js print-cmakejs-src | tail -n 1)"
            echo "CMAKE_JS_OUTPUT_DIR=$GITHUB_WORKSPACE/native-output"
          } >> "$GITHUB_ENV"
      - name: Build the target addon
        if: steps.addon-cache.outputs.cache-hit != 'true' && matrix.recipe == 'host'
        shell: bash
        run: |
          ccache --zero-stats
          pnpm run build:native -- --test
          ccache --show-stats
      - name: Build the glibc 2.17 addon
        if: steps.addon-cache.outputs.cache-hit != 'true' && matrix.recipe == 'manylinux'
        shell: bash
        run: |
          scripts/build-manylinux.sh "${CMAKE_JS_INC%%;*}" native-output
          node scripts/check-cpp-exports.mjs native-output/libassimp.node
          node scripts/check-native-host.mjs native-output/libassimp.node
          LIBASSIMP_NATIVE_ADDON="$GITHUB_WORKSPACE/native-output/libassimp.node" node src/cpp/node-addon.test.mjs
      - name: Name the addon for NAPI-RS assembly
        if: steps.addon-cache.outputs.cache-hit != 'true'
        env:
          NATIVE_SUFFIX: ${{ matrix.suffix }}
        run: >-
          node -e "const f=require('node:fs');const p=require('node:path');
          const files=f.readdirSync('native-output',{recursive:true}).filter(x=>p.basename(x)==='libassimp.node');
          if(files.length!==1)throw Error('expected one libassimp.node, found '+files.length);
          f.mkdirSync('native-artifacts',{recursive:true});
          f.copyFileSync(p.join('native-output',files[0]),p.join('native-artifacts','libassimp.'+process.env.NATIVE_SUFFIX+'.node'))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: native-artifacts/libassimp.*.node
          if-no-files-found: error
          retention-days: 1

  # The first-party C++ gates run beside the release build instead of after it.
  native-gates:
    name: native ${{ matrix.gate }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: coverage
            flags: --coverage
          - gate: sanitizers
            flags: --sanitize --test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: 'true'
      CMAKE_JS_OUTPUT_DIR: ${{ github.workspace }}/native-${{ matrix.gate }}-output
      LIBASSIMP_COMPILER_LAUNCHER: ccache
      LIBASSIMP_NATIVE_BUILD_DIR: build/native-${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ccache ninja-build zlib1g-dev
      - name: Record the engine submodule commit
        id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.gate }}-${{ steps.engine.outputs.sha }}
          restore-keys: ccache-v1-${{ matrix.gate }}-
      - run: pnpm run check:capabilities && pnpm exec tsdown && node scripts/write-native-loaders.mjs
      - name: Resolve the cmake-js Node inputs
        run: |
          {
            echo "CMAKE_JS_INC=$(pnpm exec cmake-js print-cmakejs-include | tail -n 1)"
            echo "CMAKE_JS_LIB=$(pnpm exec cmake-js print-cmakejs-lib | tail -n 1)"
            echo "CMAKE_JS_SRC=$(pnpm exec cmake-js print-cmakejs-src | tail -n 1)"
          } >> "$GITHUB_ENV"
      - name: Run the native ${{ matrix.gate }} gate
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          ccache --zero-stats
          # shellcheck disable=SC2086 # FLAGS holds several options.
          pnpm run build:native -- $FLAGS
          ccache --show-stats

  assemble:
    needs: [preflight, quality, node, native-build, build-wasm]
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.freeze.outputs.archive }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: bindings-*
          path: native-artifacts
          merge-multiple: true
      - run: pnpm run build
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - name: Generate platform directories and collect addons
        run: |
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts --output-dir native-artifacts --npm-dir npm
          for directory in npm/*/; do cp license "$directory"; done
      - run: node scripts/inspect-native.mjs
      - name: Materialize exact optional dependencies
        run: pnpm exec napi pre-publish --skip-optional-publish -t npm --no-gh-release
      - run: node scripts/check-prepared-release.mjs
      - run: node scripts/pack-test-tarballs.mjs --out tarballs
      - run: node scripts/validate-pack.mjs
      # The SBOM names the engine commit, its FetchContent pins, the vendored
      # C/C++ libraries, the Emscripten image and the npm lockfile. publish
      # attests it against the tarballs and the release carries it.
      - name: Emit the CycloneDX SBOM
        run: |
          node scripts/generate-sbom.mjs --check
          node scripts/generate-sbom.mjs --out sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/libassimp.cdx.json
          if-no-files-found: error
      - id: freeze
        env:
          ARCHIVE_LIMIT: '167772160'
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p prepared/scripts
          node <<'NODE'
          const { cpSync, existsSync } = require('node:fs');
          for (const entry of [...require('./package.json').files, 'package.json', 'npm']) {
            if (!existsSync(entry)) throw new Error(`prepared release is missing ${entry}`);
            cpSync(entry, `prepared/${entry}`, { recursive: true });
          }
          cpSync('tarballs/test-tarballs.json', 'prepared/test-tarballs.json');
          for (const entry of ['scripts/validate-pack.mjs', 'scripts/package-files.mjs']) cpSync(entry, `prepared/${entry}`);
          NODE
          archive="prepared-release-$version.tgz"
          tar -czf "$archive" -C prepared .
          sha256sum "$archive" > "$archive.sha256"
          test "$(wc -c < "$archive")" -le "$ARCHIVE_LIMIT"
          {
            echo "archive=$archive"
            echo "sha256=$(cut -d' ' -f1 < "$archive.sha256")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-release
          path: |
            prepared-release-*.tgz
            prepared-release-*.tgz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-tarballs
          path: tarballs/
          if-no-files-found: error

  # One job per target: native/Wasm parity on the target, then every lane in
  # sequence. A job per lane exhausted the organization's macOS concurrency.
  smoke:
    name: smoke (${{ matrix.suffix }})
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: bindings-${{ matrix.target }}
          path: native-artifacts
      - name: Exercise native/Wasm behavior on the target
        env:
          LIBASSIMP_NATIVE_SUFFIX: ${{ matrix.suffix }}
          LIBASSIMP_SCALE: ${{ matrix.suffix == 'linux-x64-gnu' && '1' || '0' }}
        shell: bash
        run: |
          pnpm run build
          cp native-artifacts/libassimp.*.node dist/native/
          node tests/native-parity.mjs
      # The quality job runs these suites on Wasm; native must reproduce the
      # same determinism.json fingerprints on every target, except the
      # documented PARITY_EXCEPTIONS in the format matrix.
      - name: Run the format matrix and USD suite on the native backend
        env:
          LIBASSIMP_FINGERPRINTS_OUT: ${{ runner.temp }}/native-fingerprints
        run: pnpm exec vitest run --config vitest.native.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fingerprints-${{ matrix.suffix }}
          path: ${{ runner.temp }}/native-fingerprints
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb
      - uses: ./.github/actions/smoke-lane
        with:
          lane: ${{ toJSON(matrix.lanes[0]) }}
      - if: ${{ !cancelled() && matrix.lanes[1] }}
        uses: ./.github/actions/smoke-lane
        with:
          lane: ${{ toJSON(matrix.lanes[1]) }}
      - if: ${{ !cancelled() && matrix.lanes[2] }}
        uses: ./.github/actions/smoke-lane
        with:
          lane: ${{ toJSON(matrix.lanes[2]) }}
      - if: ${{ !cancelled() && matrix.lanes[3] }}
        uses: ./.github/actions/smoke-lane
        with:
          lane: ${{ toJSON(matrix.lanes[3]) }}
      # Hostile inputs through both backends on every target: same verdict,
      # no crash, typed errors. Last, so its known failures never hide a lane.
      - name: Classify adversarial inputs on both backends
        if: ${{ !cancelled() }}
        shell: bash
        run: node tests/adversarial-parity.mjs

  browser:
    name: browser (${{ matrix.browser }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          # Firefox runs on Linux; WebKit stays on macOS on the plentiful image.
          - browser: firefox
            os: ubuntu-24.04
          - browser: webkit
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - name: Record the Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      # The Ubuntu image already carries Chromium's libraries; apt is the slow
      # and flaky part of this job, so only Firefox asks for it.
      - run: pnpm exec playwright install ${{ runner.os == 'Linux' && matrix.browser == 'firefox' && '--with-deps' || '' }} ${{ matrix.browser }}
      - run: |
          mkdir -p tarballs/extracted
          tar -xzf "tarballs/$(node -p "require('./tarballs/test-tarballs.json').packages.libassimp.filename")" -C tarballs/extracted
      - run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          LIBASSIMP_DIST_DIR: tarballs/extracted/package/dist

  # Consumers install the frozen tarball and bundle it: Vite (build and dev),
  # webpack 5, Next.js with Turbopack, esbuild and a cross-origin CDN-style
  # host each convert cube.obj in Chromium to the bytes Node produces.
  bundlers:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - name: Record the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-bundlers-${{ hashFiles('tests/bundlers/package-lock.json') }}
      - run: pnpm exec playwright install chromium
      - run: node scripts/test-bundlers.mjs --tarballs tarballs

  benchmark:
    if: github.event_name == 'pull_request'
    needs: [assemble, bench-base]
    runs-on: ubuntu-24.04
    env:
      # Origin: seven local macOS arm64 runs measured 44.836-50.650 ms conversion
      # and 67.883-68.856 ms initialization. The 500 ms conversion budget keeps
      # about 10x runner headroom; the 100 ms init budget keeps about 45%.
      # The fail-closed same-runner +10% comparison remains the regression gate.
      MAX_MEDIAN_MS: '500'
      MAX_INIT_MS: '100'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - name: Initialize the always-run benchmark report
        run: |
          printf '%s\n' '{"error":"benchmark did not complete"}' > /tmp/current-benchmark.json
          printf '%s\n' '<!-- libassimp-benchmark -->' '### Benchmark' '' 'Benchmark did not complete.' > /tmp/benchmark.md
      - name: Compare native, Wasm, and dependency-heavy resolution from the frozen tarballs
        id: current
        continue-on-error: true # Preserve the report before the final fail-closed step.
        shell: bash
        run: |
          work="$(mktemp -d)"
          npm init --yes --prefix "$work" >/dev/null
          root="$(node -p "require('./tarballs/test-tarballs.json').packages.libassimp.filename")"
          platform="$(node -p "require('./tarballs/test-tarballs.json').packages['libassimp-linux-x64-gnu'].filename")"
          npm install --prefix "$work" --ignore-scripts --no-audit --no-fund "./tarballs/$root" "./tarballs/$platform"
          entry="$work/node_modules/libassimp/dist/index.node.mjs"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
          LIBASSIMP_BENCH_ENTRY="$entry" \
            LIBASSIMP_BENCH_MARKDOWN=/tmp/native-benchmark.md \
            node bench/compare-backends.mjs > /tmp/current-benchmark.json
      - name: Check out main on the same runner
        id: base-checkout
        continue-on-error: true # Preserve diagnostics if the detached base cannot be prepared.
        shell: bash
        run: |
          # Inside the workspace, so hashFiles can key main's own Wasm cache entry.
          base_directory="$GITHUB_WORKSPACE/.bench-base"
          git worktree add --detach "$base_directory" 'origin/${{ github.base_ref }}'
          git -C "$base_directory" submodule update --init --recursive
          echo "directory=$base_directory" >> "$GITHUB_OUTPUT"
          echo "engine=$(git -C "$base_directory/assimp" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The PR's own binary is already installed from the frozen tarball.
          mkdir -p /tmp/pr-wasm && mv src/wasm/libassimp.* /tmp/pr-wasm/
      # main's build-wasm job saved its binary under this key (same paths, same
      # inputs), so the comparison measures main's engine, not the PR's. A miss
      # (evicted cache) falls back to the PR binary and says so in the report.
      - name: Restore main's Wasm from its CI cache
        id: base-wasm
        if: steps.base-checkout.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/wasm/libassimp.*
          key: wasm-${{ hashFiles('.bench-base/emsdk-image.txt', '.bench-base/assimp-builds.json', '.bench-base/CMakeLists.txt', '.bench-base/CMakePresets.json', '.bench-base/src/cpp/**', '.bench-base/.gitmodules', '.bench-base/scripts/build-wasm.mjs') }}-${{ steps.base-checkout.outputs.engine }}
      # bench-base built the base revision's own pair for the format matrix, so a
      # cache miss still measures main's engine rather than the PR's.
      - name: Download the base revision's Wasm from bench-base
        id: bench-base-wasm
        if: steps.base-checkout.outcome == 'success' && steps.base-wasm.outputs.cache-hit != 'true'
        continue-on-error: true # Falls back to the PR binary, and the report says so.
        uses: ./.github/actions/download-verified-artifact
        with:
          name: bench-base-wasm
          path: /tmp/bench-base-wasm
          expect: libassimp.js libassimp.wasm
      - name: Build main's facade on the same runner
        id: base
        if: steps.base-checkout.outcome == 'success'
        continue-on-error: true # Preserve diagnostics if the detached base cannot be prepared.
        shell: bash
        env:
          BASE_WASM_HIT: ${{ steps.base-wasm.outputs.cache-hit }}
          BENCH_BASE_WASM: ${{ steps.bench-base-wasm.outcome }}
        run: |
          base_directory='${{ steps.base-checkout.outputs.directory }}'
          mkdir -p "$base_directory/src/wasm"
          if [[ "$BASE_WASM_HIT" == true ]]; then
            cp src/wasm/libassimp.* "$base_directory/src/wasm/"
            echo "wasm=main" >> "$GITHUB_OUTPUT"
          elif [[ "$BENCH_BASE_WASM" == success ]]; then
            cp /tmp/bench-base-wasm/libassimp.js /tmp/bench-base-wasm/libassimp.wasm "$base_directory/src/wasm/"
            echo "wasm=main" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main's Wasm cache entry is gone; comparing the facades over the PR binary"
            cp /tmp/pr-wasm/libassimp.* "$base_directory/src/wasm/"
            echo "wasm=pr" >> "$GITHUB_OUTPUT"
          fi
          cd "$base_directory"
          pnpm install --frozen-lockfile
          pnpm exec tsdown
          mkdir -p dist/wasm bench/fixtures
          cp src/wasm/libassimp.js src/wasm/libassimp.wasm dist/wasm/
          # The PR owns the workload. Both revisions run the same harness and
          # fixture so changing the corpus cannot bypass the benchmark identity.
          # The base's own benchmark name is kept so an intentional rename is
          # visible to the comparison.
          base_name="$(sed -nE "/^const report = \\{$/,/^\\};$/ s/^  name: '([^']+)',$/\\1/p" bench/gated.mjs)"
          echo "name=$base_name" >> "$GITHUB_OUTPUT"
          cp "$GITHUB_WORKSPACE/bench/gated.mjs" bench/gated.mjs
          cp "$GITHUB_WORKSPACE/bench/fixtures/helical-gear.glb" bench/fixtures/helical-gear.glb
          cp "$GITHUB_WORKSPACE/tests/fnv64.mjs" tests/fnv64.mjs
          echo "directory=$base_directory" >> "$GITHUB_OUTPUT"
      - name: Compare PR and main Wasm performance
        id: regression
        continue-on-error: true # The final step fails after the comment is preserved.
        shell: bash
        env:
          BASE_BENCHMARK_NAME: ${{ steps.base.outputs.name }}
        run: |
          failed=0
          entry='${{ steps.current.outputs.entry }}'
          base_directory='${{ steps.base.outputs.directory }}'
          : "${entry:?current benchmark did not produce an entry}"
          : "${base_directory:?base build did not produce a directory}"
          LIBASSIMP_BENCH_ENTRY="$entry" LIBASSIMP_BENCH_BACKEND=wasm node bench/gated.mjs > /tmp/current-regression-1.json || failed=1
          (cd "$base_directory" && LIBASSIMP_BENCH_BACKEND=wasm LIBASSIMP_BENCH_LEGACY_WASM=1 node bench/gated.mjs > /tmp/base-benchmark-1.json) || failed=1
          (cd "$base_directory" && LIBASSIMP_BENCH_BACKEND=wasm LIBASSIMP_BENCH_LEGACY_WASM=1 node bench/gated.mjs > /tmp/base-benchmark-2.json) || failed=1
          LIBASSIMP_BENCH_ENTRY="$entry" LIBASSIMP_BENCH_BACKEND=wasm node bench/gated.mjs > /tmp/current-regression-2.json || failed=1
          node scripts/compare-benchmark.mjs \
            /tmp/current-regression-1.json,/tmp/current-regression-2.json \
            /tmp/base-benchmark-1.json,/tmp/base-benchmark-2.json \
            /tmp/regression-benchmark.md \
            "$BASE_BENCHMARK_NAME" || failed=1
          if [[ '${{ steps.base.outputs.wasm }}' != main ]]; then
            printf '\n%s\n' "main's Wasm was unavailable, so main ran the PR's binary: this row compares the TypeScript facades only." >> /tmp/regression-benchmark.md
          fi
          exit "$failed"
      # Recorded baselines gate the USD workloads, so an engine regression fails
      # even when main's binary is unavailable for the same-runner comparison.
      - name: Gate USD time and memory against the recorded baselines
        id: usd
        continue-on-error: true # The final step fails after the comment is preserved.
        shell: bash
        run: |
          entry='${{ steps.current.outputs.entry }}'
          : "${entry:?current benchmark did not produce an entry}"
          failed=0
          for run in 1 2 3; do
            LIBASSIMP_BENCH_ENTRY="$entry" node bench/usd.mjs --output "/tmp/usd-benchmark-$run.json" > /dev/null || failed=1
          done
          node scripts/compare-baselines.mjs \
            /tmp/usd-benchmark-1.json,/tmp/usd-benchmark-2.json,/tmp/usd-benchmark-3.json \
            bench/baselines.json /tmp/usd-benchmark.md || failed=1
          exit "$failed"
      - name: Compose the benchmark report
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const marker = '<!-- libassimp-benchmark -->';
          const read = (path) => existsSync(path) ? readFileSync(path, 'utf8').replace(`${marker}\n`, '') : '';
          const body = [read('/tmp/native-benchmark.md'), read('/tmp/regression-benchmark.md'), read('/tmp/usd-benchmark.md').replace('<!-- libassimp-usd-baselines -->\n', '')].filter(Boolean).join('\n');
          writeFileSync('/tmp/benchmark.md', `${marker}\n${body || '### Benchmark\n\nBenchmark did not complete.'}\n`);
          NODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wasm-benchmark
          path: |
            /tmp/*benchmark*.json
            /tmp/*benchmark*.md
            /tmp/*regression*.json
          if-no-files-found: error
      - if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- libassimp-benchmark -->';
            const body = fs.readFileSync('/tmp/benchmark.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - if: steps.current.outcome == 'failure' || steps.base-checkout.outcome == 'failure' || steps.base.outcome == 'failure' || steps.regression.outcome == 'failure' || steps.usd.outcome == 'failure'
        run: exit 1

  # The base revision's Wasm pair and linux-x64 addon for the format matrix,
  # built beside this run's own builds (a cache hit once the base's push ran).
  bench-base:
    if: github.event_name == 'pull_request'
    needs: preflight
    uses: ./.github/workflows/bench-base.yml
    with:
      sha: ${{ github.event.pull_request.base.sha }}

  # Every importer fixture crossed with every export target (small), and the
  # large synthetic grids and the helical gear (large), on both backends. Each
  # job measures the base and the PR interleaved on one runner; the large tier
  # is split in two so no job runs much longer than the others.
  format-matrix:
    name: format matrix (${{ matrix.backend }}, ${{ matrix.tier }}${{ matrix.shard != '' && format(' {0}', matrix.shard) || '' }})
    if: github.event_name == 'pull_request'
    needs: [assemble, bench-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: wasm, tier: small, shard: '' }
          - { backend: native, tier: small, shard: '' }
          - { backend: wasm, tier: large, shard: '1/2' }
          - { backend: wasm, tier: large, shard: '2/2' }
          - { backend: native, tier: large, shard: '1/2' }
          - { backend: native, tier: large, shard: '2/2' }
    steps:
      # The small tier reads the engine's fixture corpus; the large tier generates its inputs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: ${{ matrix.tier == 'small' }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: bench-base-wasm
          path: /tmp/base/wasm
          expect: libassimp.js libassimp.wasm
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: bench-base-native
          path: /tmp/base/native
          expect: libassimp.linux-x64-gnu.node
      - name: Measure the base and the PR on this runner
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD: ${{ matrix.shard }}
          TIER: ${{ matrix.tier }}
        run: |
          work="$(mktemp -d)"
          npm init --yes --prefix "$work" >/dev/null
          root="$(node -p "require('./tarballs/test-tarballs.json').packages.libassimp.filename")"
          platform="$(node -p "require('./tarballs/test-tarballs.json').packages['libassimp-linux-x64-gnu'].filename")"
          npm install --prefix "$work" --ignore-scripts --no-audit --no-fund "./tarballs/$root" "./tarballs/$platform"
          base="$(bench/prepare-build.sh "$GITHUB_WORKSPACE/.bench-base" "$BASE_SHA" /tmp/base/wasm)"
          args=(--backend "$BACKEND" --tier "$TIER" --inputs "$RUNNER_TEMP/matrix-inputs"
            --build "pr=$work/node_modules/libassimp/dist/index.node.mjs,rev=$HEAD_SHA"
            --build "base=$base,addon=/tmp/base/native/libassimp.linux-x64-gnu.node,rev=$BASE_SHA")
          name="$BACKEND-$TIER"
          if [[ -n "$SHARD" ]]; then
            args+=(--shard "$SHARD")
            name="$name-${SHARD%/*}"
          fi
          mkdir -p /tmp/format-matrix
          node bench/matrix.mjs "${args[@]}" --out "/tmp/format-matrix/$name.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-matrix-${{ strategy.job-index }}
          path: /tmp/format-matrix/*.json
          if-no-files-found: warn

  # Report-only: posts the delta table and fails only on a cell that crashes
  # in the PR but not in the base.
  format-matrix-report:
    if: always() && github.event_name == 'pull_request' && needs.format-matrix.result != 'skipped'
    needs: format-matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: format-matrix-*
          path: /tmp/format-matrix
          merge-multiple: true
      - name: Render the delta table
        id: report
        continue-on-error: true # Preserve the comment before the final fail-closed step.
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.format-matrix.result }}
        run: |
          shopt -s nullglob
          reports=(/tmp/format-matrix/*.json)
          if (( ${#reports[@]} == 0 )); then
            printf '%s\n' '<!-- libassimp-format-matrix -->' '### Format matrix' '' 'The format matrix did not produce a report.' > /tmp/format-matrix.md
            exit 0
          fi
          status=0
          node bench/matrix-report.mjs --fail-on-crash --markdown /tmp/format-matrix.md "${reports[@]}" || status=$?
          if [[ "$MATRIX_RESULT" != success ]]; then
            printf '\n%s\n' "Some format-matrix jobs did not finish (${MATRIX_RESULT}); this table covers ${#reports[@]} report(s)." >> /tmp/format-matrix.md
          fi
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-matrix-report
          path: /tmp/format-matrix.md
          if-no-files-found: warn
      - if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- libassimp-format-matrix -->';
            if (!fs.existsSync('/tmp/format-matrix.md')) return;
            const body = fs.readFileSync('/tmp/format-matrix.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - if: steps.report.outcome == 'failure'
        run: exit 1

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm audit --audit-level high

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [assemble, smoke, browser, bundlers, security]
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - run: node scripts/extract-preview-packages.mjs --from tarballs --out preview-packages
      - id: publish
        run: >-
          pnpm exec pkg-pr-new publish
          --previewVersion
          --comment=update
          --commentWithSha
          --json preview.json
          --no-template
          './preview-packages/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-pr-new-preview
          path: preview.json
          if-no-files-found: error

  preview-consumer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-pr-new-preview
          path: preview
      - run: node scripts/extract-preview-packages.mjs --from tarballs --out preview-packages
      - run: node scripts/verify-preview-install.mjs --from preview-packages --metadata preview/preview.json --sha '${{ needs.preview.outputs.sha }}'

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    # native-gates runs beside the release build, so publishing waits for it here.
    needs: [preflight, assemble, native-gates, smoke, browser, bundlers, security]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: sbom
          path: sbom
          expect: libassimp.cdx.json
      # A Sigstore-signed SBOM attestation over the exact tarballs npm receives;
      # `gh attestation verify <tgz> --repo taucad/libassimp` checks it.
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: tarballs/*.tgz
          sbom-path: sbom/libassimp.cdx.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Publish platform packages first and the root last with provenance
        run: |
          node <<'NODE' > /tmp/packages
          const manifest = require('./tarballs/test-tarballs.json');
          const rows = Object.entries(manifest.packages).sort(([a], [b]) => Number(a === 'libassimp') - Number(b === 'libassimp'));
          for (const [name, value] of rows) console.log([name, value.version, value.filename, value.integrity].join('\t'));
          NODE
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$integrity" ]]; then
                echo "::error::registry integrity differs for $name@$version"
                exit 1
              fi
            else
              existing="$(npm view "$name@$version" version 2>/dev/null || true)"
              if [[ -n "$existing" ]]; then
                echo "::error::registry returned $name@$version without dist.integrity"
                exit 1
              fi
              npm publish "./tarballs/$filename" --access public --provenance </dev/null
            fi
          done < /tmp/packages

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, assemble, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - run: node scripts/registry-wait.mjs --tarballs tarballs/test-tarballs.json
      - run: |
          work="$(mktemp -d)"
          npm init --yes --prefix "$work" >/dev/null
          mapfile -t packages < <(node -e "for (const [name,p] of Object.entries(require('./tarballs/test-tarballs.json').packages)) console.log(name+'@'+p.version)")
          npm install --prefix "$work" --force --ignore-scripts "${packages[@]}"
          npm audit signatures --prefix "$work" --json --include-attestations > /tmp/npm-audit-signatures.json
          node scripts/verify-release-attestations.mjs /tmp/npm-audit-signatures.json tarballs/test-tarballs.json '${{ github.sha }}' '${{ github.run_id }}'

  registry-smoke:
    name: registry smoke (${{ matrix.suffix }})
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.registry-verify.result == 'success'
    needs: [preflight, registry-verify]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
      - name: Install only the root package and exercise npm optional-dependency routing
        env:
          LIBASSIMP_NATIVE_SUFFIX: ${{ matrix.suffix }}
          LIBASSIMP_REGISTRY_VERSION: ${{ needs.preflight.outputs.version }}
          NAPI_RS_ENFORCE_VERSION_CHECK: '1'
        run: node scripts/test-package.mjs

  registry-release:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.registry-smoke.result == 'success'
    needs: [preflight, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: sbom
          path: sbom
          expect: libassimp.cdx.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ needs.preflight.outputs.version }}'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target '${{ github.sha }}' --generate-notes
          gh release upload "$tag" sbom/libassimp.cdx.json --clobber

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        build-wasm,
        quality,
        node,
        usd-validation,
        native-build,
        native-gates,
        assemble,
        smoke,
        browser,
        bundlers,
        benchmark,
        format-matrix-report,
        security,
        preview,
        preview-consumer,
        publish,
        registry-verify,
        registry-smoke,
        registry-release,
      ]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
          PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'build-wasm', 'quality', 'node', 'usd-validation', 'native-build', 'native-gates', 'assemble', 'smoke', 'browser', 'bundlers', 'security'];
          if (process.env.PUBLISH === 'true') required.push('publish', 'registry-verify', 'registry-smoke', 'registry-release');
          if (process.env.PREVIEW === 'true') required.push('preview', 'preview-consumer');
          if (needs.preflight.outputs.kind === 'pull-request') required.push('benchmark');
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (!required.includes('benchmark') && !['success', 'skipped'].includes(needs.benchmark?.result)) failures.push('benchmark');
          // Report-only, except that a cell crashing in the PR but not in the base fails it.
          if (!['success', 'skipped'].includes(needs['format-matrix-report']?.result)) failures.push('format-matrix-report');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
