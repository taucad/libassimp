name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.matrix }}
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      smoke-matrix: ${{ steps.smoke-matrix.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" --ref "$REF_NAME" --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files
      - id: build-matrix
        run: node scripts/native-matrix.mjs --kind build
      - id: smoke-matrix
        run: node scripts/native-matrix.mjs --kind smoke

  build-wasm:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: emscripten/emsdk:6.0.8@sha256:f174124ff798a3ead1abef247d9a849c270b642d552fea500a42565ff210f765
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends ccache ninja-build
      - id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: wasm-cache
        with:
          path: src/wasm/libassimp.*
          key: wasm-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules') }}-${{ steps.engine.outputs.sha }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules') }}-${{ steps.engine.outputs.sha }}
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          LIBASSIMP_EMSDK: host
        run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm
          path: src/wasm/libassimp.*
          if-no-files-found: error

  quality:
    needs: [preflight, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
          expect: libassimp.js libassimp.wasm libassimp.manifest.json
      - run: pnpm nx run libassimp:quality
      - run: >-
          node --test
          tests/ci/ci-release.test.mjs
          tests/ci/release-attestations.test.mjs
          tests/native-packaging.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: [preflight, build-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
      - run: pnpm nx run libassimp:docs-prose

  node:
    needs: [preflight, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
      - run: pnpm nx run libassimp:test
      - run: pnpm nx run libassimp:typecheck

  native-build:
    name: native build (${{ matrix.target }})
    needs: [preflight, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build zlib1g-dev
      - run: pnpm run build
      - name: Resolve the cmake-js Node inputs
        shell: bash
        run: |
          {
            echo "CMAKE_JS_INC=$(pnpm exec cmake-js print-cmakejs-include | tail -n 1)"
            echo "CMAKE_JS_LIB=$(pnpm exec cmake-js print-cmakejs-lib | tail -n 1)"
            echo "CMAKE_JS_SRC=$(pnpm exec cmake-js print-cmakejs-src | tail -n 1)"
            echo "CMAKE_JS_OUTPUT_DIR=$GITHUB_WORKSPACE/native-output"
          } >> "$GITHUB_ENV"
      - name: Build the target addon
        if: matrix.recipe == 'host'
        run: pnpm run build:native -- --test
      - name: Build the glibc 2.17 addon
        if: matrix.recipe == 'manylinux'
        shell: bash
        run: |
          node_include="${CMAKE_JS_INC%%;*}"
          cmake -E remove_directory .node-headers
          cmake -E make_directory .node-headers native-output
          cp -R "$node_include/." .node-headers/
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src --env HOME=/tmp \
            quay.io/pypa/manylinux2014_x86_64@sha256:f6077fab327d7823d7cee287b93ef63efe3af0e234add7503121247c1475ebec \
            bash -lc 'cmake --preset native -G "Unix Makefiles" -B build/native-manylinux \
              -DNODE_ADDON_API_DIR=/src/node_modules/node-addon-api \
              -DCMAKE_JS_INC=/src/.node-headers -DCMAKE_JS_LIB= -DCMAKE_JS_SRC= \
              -DCMAKE_JS_OUTPUT_DIR=/src/native-output \
              -DLIBASSIMP_NATIVE_BUILD_IDENTITY=linux-x64-napi8 \
              -DLIBASSIMP_NATIVE_TESTS=OFF -DLIBASSIMP_NATIVE_ADDON=ON && \
              cmake --build build/native-manylinux --parallel && \
              strip --strip-unneeded /src/native-output/libassimp.node'
          node scripts/check-cpp-exports.mjs native-output/libassimp.node
          node scripts/check-native-host.mjs native-output/libassimp.node
          LIBASSIMP_NATIVE_ADDON=native-output/libassimp.node node src/cpp/node-addon.test.mjs
      - name: Clear container-local FetchContent metadata
        if: matrix.recipe == 'manylinux'
        shell: bash
        run: |
          cmake -E remove_directory assimp/contrib/meshlab/autoclone
          cmake -E remove_directory assimp/contrib/tinyusdz/autoclone
          cmake -E remove_directory assimp/contrib/web-ifc/autoclone
          cmake -E remove_directory assimp/contrib/lib3mf/autoclone
      - name: Enforce complete first-party C++ coverage
        if: runner.os == 'Linux'
        env:
          CMAKE_JS_OUTPUT_DIR: ${{ github.workspace }}/native-coverage-output
          CC: clang
          CXX: clang++
          LIBASSIMP_NATIVE_BUILD_DIR: build/native-coverage
        run: pnpm run build:native -- --coverage
      - name: Run native sanitizers
        if: runner.os == 'Linux'
        env:
          CMAKE_JS_OUTPUT_DIR: ${{ github.workspace }}/native-sanitize-output
          CC: clang
          CXX: clang++
          LIBASSIMP_NATIVE_BUILD_DIR: build/native-sanitize
        run: pnpm run build:native -- --sanitize --test
      - name: Name the addon for NAPI-RS assembly
        env:
          NATIVE_SUFFIX: ${{ matrix.suffix }}
        run: >-
          node -e "const f=require('node:fs');const p=require('node:path');
          const files=f.readdirSync('native-output',{recursive:true}).filter(x=>p.basename(x)==='libassimp.node');
          if(files.length!==1)throw Error('expected one libassimp.node, found '+files.length);
          f.mkdirSync('native-artifacts',{recursive:true});
          f.copyFileSync(p.join('native-output',files[0]),p.join('native-artifacts','libassimp.'+process.env.NATIVE_SUFFIX+'.node'))"
      - name: Exercise native/Wasm behavior on the build host
        env:
          LIBASSIMP_NATIVE_SUFFIX: ${{ matrix.suffix }}
          LIBASSIMP_SCALE: ${{ matrix.suffix == 'linux-x64-gnu' && '1' || '0' }}
        shell: bash
        run: |
          cp native-artifacts/libassimp.*.node dist/native/
          node tests/native-parity.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ matrix.target }}
          path: native-artifacts/libassimp.*.node
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [preflight, quality, docs-prose, node, native-build, build-wasm]
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.freeze.outputs.archive }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm
          path: src/wasm
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: bindings-*
          path: native-artifacts
          merge-multiple: true
      - run: pnpm run build
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - name: Generate platform directories and collect addons
        run: |
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts --output-dir native-artifacts --npm-dir npm
          for directory in npm/*/; do cp license "$directory"; done
      - run: node scripts/inspect-native.mjs
      - name: Materialize exact optional dependencies
        run: pnpm exec napi pre-publish --skip-optional-publish -t npm --no-gh-release
      - run: node scripts/check-prepared-release.mjs
      - run: node scripts/pack-test-tarballs.mjs --out tarballs
      - run: node scripts/validate-pack.mjs
      - id: freeze
        env:
          ARCHIVE_LIMIT: '167772160'
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p prepared/scripts
          node <<'NODE'
          const { cpSync, existsSync } = require('node:fs');
          for (const entry of [...require('./package.json').files, 'package.json', 'npm', 'test-tarballs.json']) {
            if (!existsSync(entry)) throw new Error(`prepared release is missing ${entry}`);
            cpSync(entry, `prepared/${entry}`, { recursive: true });
          }
          for (const entry of ['scripts/validate-pack.mjs', 'scripts/package-files.mjs']) cpSync(entry, `prepared/${entry}`);
          NODE
          archive="prepared-release-$version.tgz"
          tar -czf "$archive" -C prepared .
          sha256sum "$archive" > "$archive.sha256"
          test "$(wc -c < "$archive")" -le "$ARCHIVE_LIMIT"
          {
            echo "archive=$archive"
            echo "sha256=$(cut -d' ' -f1 < "$archive.sha256")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-release
          path: |
            prepared-release-*.tgz
            prepared-release-*.tgz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-tarballs
          path: tarballs/
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.suffix }}, ${{ matrix.lane }})
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb
      - name: Smoke the frozen tarballs in a clean install
        env:
          LIBASSIMP_ELECTRON_VERSION: ${{ matrix.electron }}
          LIBASSIMP_NATIVE_SUFFIX: ${{ matrix.suffix }}
          LIBASSIMP_RUNTIME: ${{ matrix.runtime }}
          LIBASSIMP_TARBALL_DIR: tarballs
        run: node scripts/test-package.mjs

  browser:
    name: browser (${{ matrix.browser }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-14
          - browser: webkit
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: |
          mkdir -p tarballs/extracted
          tar -xzf "tarballs/$(node -p "require('./tarballs/test-tarballs.json').packages.libassimp.filename")" -C tarballs/extracted
      - run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          LIBASSIMP_DIST_DIR: tarballs/extracted/package/dist

  benchmark:
    if: github.event_name == 'pull_request'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - id: gate
        run: |
          work="$(mktemp -d)"
          npm init --yes --prefix "$work" >/dev/null
          root="$(node -p "require('./tarballs/test-tarballs.json').packages.libassimp.filename")"
          platform="$(node -p "require('./tarballs/test-tarballs.json').packages['libassimp-linux-x64-gnu'].filename")"
          npm install --prefix "$work" --ignore-scripts --no-audit --no-fund "./tarballs/$root" "./tarballs/$platform"
          LIBASSIMP_BENCH_ENTRY="$work/node_modules/libassimp/dist/index.node.mjs" \
            LIBASSIMP_BENCH_MARKDOWN=/tmp/benchmark.md \
            node bench/compare-backends.mjs > /tmp/current-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-wasm-benchmark
          path: /tmp/current-benchmark.json
          if-no-files-found: error
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- libassimp-benchmark -->';
            const body = fs.readFileSync('/tmp/benchmark.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm audit --audit-level high

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, assemble, smoke, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-tarballs
          path: tarballs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Publish platform packages first and the root last with provenance
        run: |
          node <<'NODE' > /tmp/packages
          const manifest = require('./tarballs/test-tarballs.json');
          const rows = Object.entries(manifest.packages).sort(([a], [b]) => Number(a === 'libassimp') - Number(b === 'libassimp'));
          for (const [name, value] of rows) console.log([name, value.version, value.filename, value.integrity].join('\t'));
          NODE
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then test "$published" = "$integrity"; else npm publish "./tarballs/$filename" --access public --provenance; fi
          done < /tmp/packages

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, assemble, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-tarballs
          path: tarballs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - run: node scripts/registry-wait.mjs --tarballs tarballs/test-tarballs.json
      - run: |
          work="$(mktemp -d)"
          npm init --yes --prefix "$work" >/dev/null
          mapfile -t packages < <(node -e "for (const [name,p] of Object.entries(require('./tarballs/test-tarballs.json').packages)) console.log(name+'@'+p.version)")
          npm install --prefix "$work" --force --ignore-scripts "${packages[@]}"
          npm audit signatures --prefix "$work" --json --include-attestations > /tmp/npm-audit-signatures.json
          node scripts/verify-release-attestations.mjs /tmp/npm-audit-signatures.json tarballs/test-tarballs.json '${{ github.sha }}' '${{ github.run_id }}'

  registry-smoke:
    name: registry smoke (${{ matrix.suffix }})
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.registry-verify.result == 'success'
    needs: [preflight, registry-verify]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
      - name: Install only the root package and exercise npm optional-dependency routing
        env:
          LIBASSIMP_NATIVE_SUFFIX: ${{ matrix.suffix }}
          LIBASSIMP_REGISTRY_VERSION: ${{ needs.preflight.outputs.version }}
          NAPI_RS_ENFORCE_VERSION_CHECK: '1'
        run: node scripts/test-package.mjs

  registry-release:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.registry-smoke.result == 'success'
    needs: [preflight, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ needs.preflight.outputs.version }}'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        build-wasm,
        quality,
        docs-prose,
        node,
        native-build,
        assemble,
        smoke,
        browser,
        benchmark,
        security,
        publish,
        registry-verify,
        registry-smoke,
        registry-release,
      ]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'build-wasm', 'quality', 'docs-prose', 'node', 'native-build', 'assemble', 'smoke', 'browser', 'security'];
          if (process.env.PUBLISH === 'true') required.push('publish', 'registry-verify', 'registry-smoke', 'registry-release');
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (!['success', 'skipped'].includes(needs.benchmark?.result)) failures.push('benchmark');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
