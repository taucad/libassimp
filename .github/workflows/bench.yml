name: USDA allocator investigation
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        type: string
        default: ""
        description: Reuse a completed selective-purge build for broader probes
      policy_only:
        type: boolean
        default: false
        description: Run released-addon policy probes without rebuilding
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Prepare pinned facade and headers
        run: |
          mkdir -p .diagnostic
          cd .diagnostic
          node -e 'require("fs").writeFileSync("package.json", JSON.stringify({name:"usda-allocator-probe",private:true}))'
          npm install --ignore-scripts --no-audit --no-fund libassimp@0.4.0 node-addon-api@8.9.2
          cp -r "$(dirname "$(dirname "$(which node)")")/include/node" node-headers
          cp ../bench/fixtures/helical-gear.glb gear.glb
          cp ../bench/allocator-probe.mjs probe.mjs
          cp ../bench/allocator-broad-probe.mjs broad-probe.mjs
      - name: Build allocator pair with identical static runtime and engine
        if: ${{ !inputs.policy_only && !inputs.artifact_run }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -v "$PWD/.diagnostic:/evidence" -w /src quay.io/pypa/manylinux2014_x86_64@sha256:f6077fab327d7823d7cee287b93ef63efe3af0e234add7503121247c1475ebec bash -lc '
            set -e
            cmake --preset native -G "Unix Makefiles" -B /evidence/build -DNODE_ADDON_API_DIR=/evidence/node_modules/node-addon-api -DCMAKE_JS_INC=/evidence/node-headers -DCMAKE_JS_LIB= -DCMAKE_JS_SRC= -DCMAKE_JS_OUTPUT_DIR=/evidence/on -DLIBASSIMP_NATIVE_BUILD_IDENTITY=linux-x64-napi8 -DLIBASSIMP_NATIVE_TESTS=OFF -DLIBASSIMP_NATIVE_ADDON=ON
            cmake --build /evidence/build --parallel 4
            cmake -S /src -B /evidence/build -DLIBASSIMP_DIAG_SYSTEM_ALLOCATOR=ON -DCMAKE_JS_OUTPUT_DIR=/evidence/off
            cmake --build /evidence/build --parallel 4
          ' 2>&1 | tee .diagnostic/build.log
      - name: Interleaved isolated-process probes
        if: ${{ !inputs.policy_only && !inputs.artifact_run }}
        run: |
          cd .diagnostic
          node --version > environment.txt
          uname -a >> environment.txt
          ldd on/libassimp.node >> environment.txt
          ldd off/libassimp.node >> environment.txt
          for iteration in $(seq 1 15); do
            for variant in on disabled release off purge0; do
              unset MIMALLOC_ARENA_PURGE_IMMEDIATE_SIZE
              if [ "$variant" = disabled ]; then export MIMALLOC_ARENA_PURGE_IMMEDIATE_SIZE=1T; fi
              if [ "$variant" = release ]; then unset NAPI_RS_NATIVE_LIBRARY_PATH; else export NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/${variant/purge0/on}/libassimp.node"; fi
              if [ "$variant" = disabled ]; then export NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/on/libassimp.node"; fi
              if [ "$variant" = purge0 ]; then export MIMALLOC_PURGE_DELAY=0; else unset MIMALLOC_PURGE_DELAY; fi
              VARIANT="$variant" MIMALLOC_SHOW_STATS=1 node --expose-gc probe.mjs >> results.jsonl 2>> allocator-stats.log
            done
          done
      - name: Reuse native build
        if: ${{ inputs.artifact_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.artifact_run }}
        run: gh run download "$BUILD_RUN" --name usda-allocator-evidence --dir .diagnostic --repo taucad/libassimp
      - name: Broader native comparisons and round trips
        if: ${{ inputs.artifact_run }}
        run: |
          node --input-type=module -e "import {GENERATED} from './bench/matrix-inputs.mjs'; GENERATED.glb.write('.diagnostic',1024); GENERATED.usda.write('.diagnostic',1024);"
          cd .diagnostic
          for iteration in $(seq 1 9); do
            for cell in gear.glb:usda grid.glb:usda grid.glb:glb grid.usda:usdz; do
              for variant in release on disabled; do
                unset NAPI_RS_NATIVE_LIBRARY_PATH MIMALLOC_ARENA_PURGE_IMMEDIATE_SIZE
                if [ "$variant" != release ]; then export NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/on/libassimp.node"; fi
                if [ "$variant" = disabled ]; then export MIMALLOC_ARENA_PURGE_IMMEDIATE_SIZE=1T; fi
                VARIANT="$variant" INPUT="${cell%:*}" TARGET="${cell#*:}" node --expose-gc broad-probe.mjs >> broad-results.jsonl
              done
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: usda-allocator-evidence
          include-hidden-files: true
          path: |
            .diagnostic/*.log
            .diagnostic/*.jsonl
            .diagnostic/environment.txt
            .diagnostic/on/libassimp.node
            .diagnostic/off/libassimp.node
