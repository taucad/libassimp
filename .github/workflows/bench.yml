name: USDA allocator investigation
on:
  workflow_dispatch:
    inputs:
      policy_only:
        type: boolean
        default: false
        description: Run released-addon policy probes without rebuilding
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Prepare pinned facade and headers
        run: |
          mkdir -p .diagnostic
          cd .diagnostic
          node -e 'require("fs").writeFileSync("package.json", JSON.stringify({name:"usda-allocator-probe",private:true}))'
          npm install --ignore-scripts --no-audit --no-fund libassimp@0.4.0 node-addon-api@8.9.2
          cp -r "$(dirname "$(dirname "$(which node)")")/include/node" node-headers
          cp ../bench/fixtures/helical-gear.glb gear.glb
          cp ../bench/allocator-probe.mjs probe.mjs
      - name: Probe published allocator policy first
        run: |
          cd .diagnostic
          for iteration in 1 2 3 4 5; do
            for delay in 1000 100 10 1 0; do
              VARIANT="release-delay$delay" MIMALLOC_PURGE_DELAY="$delay" MIMALLOC_SHOW_STATS=1 node --expose-gc probe.mjs >> policy-results.jsonl 2>> policy-stats.log
            done
          done
      - name: Probe narrower published allocator controls
        run: |
          cd .diagnostic
          for iteration in 1 2 3 4 5; do
            for variant in default no-thp no-arena demand-commit eager0 collect1; do
              options=()
              case "$variant" in
                no-thp) options+=(MIMALLOC_ALLOW_THP=0) ;;
                no-arena) options+=(MIMALLOC_DISALLOW_ARENA_ALLOC=1) ;;
                demand-commit) options+=(MIMALLOC_PAGE_COMMIT_ON_DEMAND=1) ;;
                eager0) options+=(MIMALLOC_EAGER_COMMIT=0) ;;
                collect1) options+=(MIMALLOC_PURGE_DELAY=10 MIMALLOC_GENERIC_COLLECT=1) ;;
              esac
              env "${options[@]}" VARIANT="$variant" MIMALLOC_SHOW_STATS=1 node --expose-gc probe.mjs >> narrow-results.jsonl 2>> narrow-stats.log
            done
          done
      - name: Build allocator pair with identical static runtime and engine
        if: ${{ !inputs.policy_only }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -v "$PWD/.diagnostic:/evidence" -w /src quay.io/pypa/manylinux2014_x86_64@sha256:f6077fab327d7823d7cee287b93ef63efe3af0e234add7503121247c1475ebec bash -lc '
            set -e
            cmake --preset native -G "Unix Makefiles" -B /evidence/build -DNODE_ADDON_API_DIR=/evidence/node_modules/node-addon-api -DCMAKE_JS_INC=/evidence/node-headers -DCMAKE_JS_LIB= -DCMAKE_JS_SRC= -DCMAKE_JS_OUTPUT_DIR=/evidence/on -DLIBASSIMP_NATIVE_BUILD_IDENTITY=linux-x64-napi8 -DLIBASSIMP_NATIVE_TESTS=OFF -DLIBASSIMP_NATIVE_ADDON=ON
            cmake --build /evidence/build --parallel 4
            cmake -S /src -B /evidence/build -DLIBASSIMP_DIAG_SYSTEM_ALLOCATOR=ON -DCMAKE_JS_OUTPUT_DIR=/evidence/off
            cmake --build /evidence/build --parallel 4
          ' 2>&1 | tee .diagnostic/build.log
      - name: Interleaved isolated-process probes
        if: ${{ !inputs.policy_only }}
        run: |
          cd .diagnostic
          node --version > environment.txt
          uname -a >> environment.txt
          ldd on/libassimp.node >> environment.txt
          ldd off/libassimp.node >> environment.txt
          for iteration in 1 2 3 4 5; do
            for variant in on off purge0 release; do
              if [ "$variant" = release ]; then unset NAPI_RS_NATIVE_LIBRARY_PATH; else export NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/${variant/purge0/on}/libassimp.node"; fi
              if [ "$variant" = purge0 ]; then export MIMALLOC_PURGE_DELAY=0; else unset MIMALLOC_PURGE_DELAY; fi
              VARIANT="$variant" MIMALLOC_SHOW_STATS=1 node --expose-gc probe.mjs >> results.jsonl 2>> allocator-stats.log
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: usda-allocator-evidence
          include-hidden-files: true
          path: |
            .diagnostic/*.log
            .diagnostic/*.jsonl
            .diagnostic/environment.txt
            .diagnostic/on/libassimp.node
            .diagnostic/off/libassimp.node
