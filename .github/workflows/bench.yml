name: Benchmark drift

on:
  schedule:
    - cron: '17 4 1 * *' # Origin: monthly exploratory cadence from picovoxel.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Exploratory runs need the same artifact `ci.yml` gates, and wasm is never
  # committed. The benchmark measures the root entry and its sole binary.
  build-wasm:
    runs-on: ubuntu-24.04
    # Origin: about 3x the measured cold job after the -O2 link: compile takes
    # roughly 25 minutes on 4 vCPU and link takes less than 1 minute. The prior
    # 180-minute ceiling matched the -O3 link.
    timeout-minutes: 90
    container:
      image: emscripten/emsdk:6.0.8@sha256:f174124ff798a3ead1abef247d9a849c270b642d552fea500a42565ff210f765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install the build tools the emsdk image omits
        run: apt-get update && apt-get install -y --no-install-recommends ccache ninja-build
      - name: Record the engine submodule commit
        id: engine
        run: echo "sha=$(git -C assimp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('emsdk-image.txt', 'assimp-builds.json', 'CMakeLists.txt', 'CMakePresets.json', 'src/cpp/**', '.gitmodules') }}-${{ steps.engine.outputs.sha }}
      - name: Build libassimp.wasm
        env:
          LIBASSIMP_EMSDK: host
        run: node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: src/wasm/libassimp.*
          if-no-files-found: error

  drift:
    needs: build-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: src/wasm
      - id: benchmark
        continue-on-error: true # Origin: exploratory drift opens an issue; PR gate remains fail-closed in ci.yml.
        env:
          # Origin: two de72965 exact-head runs on ubuntu-24.04/Node 26 measured
          # 1.113-3.274 ms conversion and 67.883-68.856 ms initialization.
          # The fail-closed same-runner comparison remains in `ci.yml`.
          MAX_MEDIAN_MS: '5'
          MAX_INIT_MS: '100'
        run: |
          pnpm run build
          pnpm run benchmark
      - if: steps.benchmark.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create claude \
            --color 5319E7 \
            --description 'Picked up by Claude automation' \
            --force
          gh issue create \
            --title 'Benchmark drift detected' \
            --body "Monthly benchmark drift failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            --label claude
