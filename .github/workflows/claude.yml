name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # Job 1: Notify external contributors that approval is needed
  # This runs immediately when an untrusted user requests Claude
  notify-approval-needed:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '/approve-claude') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post approval needed comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const requester = context.payload.comment.user.login;
            const originalComment = context.payload.comment.body;
            const issueNumber = context.issue.number;

            const body = `### 🤖 Claude Assistance Requested

            @${requester} has requested Claude assistance on this PR.

            > ${originalComment.split('\n').join('\n> ')}

            ---

            **⏳ Waiting for maintainer approval**

            This request is from an external contributor and requires approval before Claude can run.

            **Maintainers:** To approve this request, comment:
            \`\`\`
            /approve-claude Execute the external request quoted in the latest Claude Assistance Requested comment above.
            \`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  # Job 2: Run Claude when a maintainer approves an external request
  # Triggered by a trusted user commenting /approve-claude
  claude-approved:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/approve-claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow token replaces the OIDC exchange for an app token, so
          # the job needs no id-token permission.
          github_token: ${{ github.token }}
          trigger_phrase: /approve-claude

          # Additional permissions for Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Claude CLI arguments - model and tools configuration
          claude_args: |
            --allowedTools "Bash(pnpm run test),Bash(pnpm run lint),Bash(pnpm run typecheck),Bash(pnpm run format:check),Bash(git status),Bash(git diff *),Bash(git log *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh run view *),Bash(gh issue view *)"

  # Job 3: Run Claude directly for trusted users (OWNER, MEMBER, COLLABORATOR)
  # No approval needed - runs immediately
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '/approve-claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') ||
         contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' &&
        github.event.action == 'labeled' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      # A label carries no author_association, and the issue body it points
      # Claude at may come from anyone. Act only when the account that applied
      # the label is a member or collaborator with write access or above.
      - name: Require a trusted labeler
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELER: ${{ github.event.sender.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          permission="$(gh api "repos/$REPOSITORY/collaborators/$LABELER/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in
            admin | maintain | write) echo "$LABELER has $permission access" ;;
            *)
              echo "::error::$LABELER ($permission) cannot start Claude on an issue body; a member or collaborator must apply the label"
              exit 1
              ;;
          esac
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow token replaces the OIDC exchange for an app token, so
          # the job needs no id-token permission.
          github_token: ${{ github.token }}

          # Additional permissions for Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Claude CLI arguments - model and tools configuration
          claude_args: |
            --allowedTools "Bash(pnpm run test),Bash(pnpm run lint),Bash(pnpm run typecheck),Bash(pnpm run format:check),Bash(git status),Bash(git diff *),Bash(git log *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh run view *),Bash(gh issue view *)"
